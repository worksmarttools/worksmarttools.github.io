<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Worksmart Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            font-size: 18px;
        }
        
        .error-container {
            background: white;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            margin: 100px auto;
        }
        
        .error-container h2 {
            color: #e74c3c;
            margin-bottom: 20px;
        }
        
        .error-container p {
            color: #666;
            margin-bottom: 20px;
        }
        
        .error-container a {
            color: #007bff;
            text-decoration: none;
        }
        
        .error-container button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .error-container button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div id="loadingScreen" class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">Checking authentication...</div>
    </div>
    
    <div id="errorScreen" style="display: none;">
        <div class="error-container">
            <h2>⚠️ Access Denied</h2>
            <p>You don't have permission to access the admin panel.</p>
            <button onclick="redirectToLogin()">Go to Login</button>
        </div>
    </div>

    <script src="/config.js"></script>
    <script>
        // Check if config.js loaded properly
        if (typeof API_BASE_URL === 'undefined') {
            console.error('config.js not loaded. Using fallback.');
            var API_BASE_URL = ''; // Will be replaced by config.js
        }
        
        // Redirect to login function
        function redirectToLogin() {
            window.location.href = '/admin-as/login.html';
        }
        
        // Main authentication check
        async function checkAuthentication() {
            const sessionToken = localStorage.getItem('sessionToken');
            const username = localStorage.getItem('username');
            
            // If no session token, redirect to login
            if (!sessionToken) {
                console.log('No session token found, redirecting to login');
                window.location.href = '/admin-as/login.html';
                return;
            }
            
            // If API_BASE_URL is not configured, show error
            if (!API_BASE_URL || API_BASE_URL === 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec') {
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('errorScreen').style.display = 'block';
                document.querySelector('.error-container h2').textContent = '⚠️ Configuration Error';
                document.querySelector('.error-container p').innerHTML = 'API_BASE_URL not configured in config.js<br><br>Please update config.js with your Google Apps Script Web App URL.';
                return;
            }
            
            try {
                // Verify session with server
                const response = await fetch(`${API_BASE_URL}?action=verifySession&sessionToken=${sessionToken}`);
                const result = await response.json();
                
                if (result.success) {
                    // Session is valid, redirect to dashboard
                    console.log('Session valid, redirecting to dashboard');
                    window.location.href = '/admin-as/dashboard.html';
                } else {
                    // Session invalid, clear local storage and redirect to login
                    console.log('Session invalid, clearing storage');
                    localStorage.removeItem('sessionToken');
                    localStorage.removeItem('username');
                    window.location.href = '/admin-as/login.html';
                }
            } catch (error) {
                console.error('Error verifying session:', error);
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('errorScreen').style.display = 'block';
                document.querySelector('.error-container p').innerHTML = `Error connecting to server: ${error.message}<br><br>Make sure your Apps Script Web App is deployed correctly.`;
            }
        }
        
        // Also check if user is trying to access without proper authentication
        function checkDirectAccess() {
            // If someone tries to access this page directly without going through login
            const sessionToken = localStorage.getItem('sessionToken');
            if (!sessionToken) {
                console.log('Direct access detected, redirecting to login');
                window.location.href = '/admin-as/login.html';
                return false;
            }
            return true;
        }
        
        // Start authentication check
        if (checkDirectAccess()) {
            checkAuthentication();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Worksmart Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            max-width: 400px;
            width: 90%;
            margin: 20px auto;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        button:hover {
            background: #5a67d8;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            color: #e53e3e;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            background: #fff5f5;
            border-radius: 4px;
            font-size: 14px;
        }

        .success {
            color: #38a169;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            background: #f0fff4;
            border-radius: 4px;
            font-size: 14px;
        }

        .info-text {
            text-align: center;
            margin-top: 20px;
            color: #718096;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 style="text-align:center; margin-bottom:10px;">🔐 Admin Login</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" id="loginBtn">Login</button>
            <div id="errorMsg" class="error"></div>
            <div id="successMsg" class="success"></div>
        </form>

        <div class="info-text">
            Admin panel for managing products and categories.
        </div>
    </div>

    <script src="/config.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const loginBtn = document.getElementById('loginBtn');
            
            errorDiv.textContent = '';
            successDiv.textContent = '';
            
            if (!username || !password) {
                errorDiv.textContent = 'Please enter both username and password';
                return;
            }
            
            if (!API_BASE_URL) {
                errorDiv.textContent = 'Configuration error. Please check config.js';
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            
            try {
                // Try POST first
                const response = await fetch(`${API_BASE_URL}`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        action: 'login',
                        username: username, 
                        password: password 
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    successDiv.textContent = 'Login successful! Redirecting...';
                    localStorage.setItem('sessionToken', result.sessionToken);
                    localStorage.setItem('username', result.username);
                    
                    setTimeout(() => {
                        window.location.href = '/admin-as/dashboard.html';
                    }, 1000);
                } else {
                    errorDiv.textContent = result.error || 'Invalid username or password';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Connection error. Please check:';
                errorDiv.innerHTML += '<br>• Apps Script is deployed as "Anyone" can access';
                errorDiv.innerHTML += '<br>• URL in config.js is correct';
                errorDiv.innerHTML += '<br>• You have an internet connection';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>

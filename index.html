<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSmart CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --radius: 1rem; --bg: #f8fafc; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; }
        .btn-primary { background: var(--primary); color: white; border-radius: var(--radius); }
        .dynamic-text { color: var(--primary); }
        .tab-active { border-bottom: 2px solid var(--primary); color: var(--primary); font-weight: bold; }
        .dropdown:hover .dropdown-menu { display: block; }
    </style>
</head>
<body>
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.hash='#/'">
                <img id="siteLogo" src="" class="h-8 hidden">
                <span id="siteName" class="text-xl font-black dynamic-text">WORKSMART</span>
            </div>
            <div id="mainMenu" class="hidden md:flex items-center gap-6"></div>
            <div class="flex items-center gap-4">
                <button class="md:hidden p-2 text-slate-600">☰</button>
            </div>
        </div>
    </nav>

    <main id="app" class="container mx-auto px-4 py-6 min-h-screen"></main>

    <footer id="siteFooter" class="border-t mt-12 py-12 bg-white"></footer>

    <script>
        // UPDATE THIS URL AFTER DEPLOYING YOUR APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbziyBdgQpt2cb9VNZHW1QJ9dPVMEM1UFURP_eHhhAtvOvNAaF-VOKdYA1BOTgFV2klW/exec"; 
        
        let store = { company: [], products: [], categories: [], pages: [], contentBlocks: [], theme: [], seoDefaults: [], footer: [] };
        let activeCategoryFilter = "all";

        // --- CORE ENGINE ---
        async function fetchData() {
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getPublicData' }) });
                const json = await res.json();
                store = json.data;
                applyTheme();
                buildHierarchicalMenu();
                renderFooter();
                injectSeoMetaTags();
                router();
            } catch(e) { console.error("CMS Load Error:", e); }
        }

        function applyTheme() {
            const t = Object.fromEntries((store.theme || []).map(i=>[i.Key,i.Value]));
            document.documentElement.style.setProperty('--primary', t.primary_color || '#0f172a');
            document.documentElement.style.setProperty('--radius', (t.card_radius || 16)+'px');
            document.body.style.backgroundColor = t.body_bg || '#f8fafc';
            const company = Object.fromEntries((store.company || []).map(i=>[i.Key,i.Value]));
            document.getElementById('siteName').innerText = company.company_name || "WORKSMART";
            const logo = document.getElementById('siteLogo');
            if(company.logo_url) { logo.src = company.logo_url; logo.classList.remove('hidden'); }
        }

        function buildHierarchicalMenu() {
            const pages = (store.pages || []).filter(p => p.Status === 'published');
            const menuContainer = document.getElementById('mainMenu');
            let html = `<a href="#/" class="px-3 py-2 text-sm font-bold hover:dynamic-text">HOME</a>`;
            
            const roots = pages.filter(p => !p.ParentID).sort((a,b) => a.MenuOrder - b.MenuOrder);
            roots.forEach(root => {
                const children = pages.filter(p => p.ParentID == root.ID);
                if(children.length > 0) {
                    html += `
                    <div class="relative dropdown group">
                        <button class="flex items-center gap-1 px-3 py-2 text-sm font-bold hover:dynamic-text uppercase">
                            ${escapeHtml(root.Title)} ▾
                        </button>
                        <div class="absolute left-0 top-full hidden group-hover:block bg-white border shadow-xl rounded-xl min-w-[200px] z-50">
                            ${children.map(c => `<a href="#/page/${c.Slug}" class="block px-4 py-3 text-sm hover:bg-slate-50 border-b last:border-0">${escapeHtml(c.Title)}</a>`).join('')}
                        </div>
                    </div>`;
                } else {
                    html += `<a href="#/page/${root.Slug}" class="px-3 py-2 text-sm font-bold hover:dynamic-text uppercase">${escapeHtml(root.Title)}</a>`;
                }
            });
            html += `<a href="#/products" class="px-3 py-2 text-sm font-bold hover:dynamic-text">PRODUCTS</a>`;
            menuContainer.innerHTML = html;
        }

        // --- IMAGE HANDLING (FIXED FOR APPS SCRIPT) ---
        async function uploadImage(fileInput, targetFieldId) {
            if (!fileInput.files.length) return;
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result.split(',')[1];
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'uploadImage',
                        data: { file: base64Data, filename: file.name, mimeType: file.type }
                    })
                });
                const json = await res.json();
                if (json.status === 'success') {
                    document.getElementById(targetFieldId).value = json.url;
                    alert('Uploaded to Drive successfully!');
                } else { alert('Error: ' + json.message); }
            };
            reader.readAsDataURL(file);
        }

        // --- PUBLIC VIEWS ---
        function renderHome(container) {
            const blocks = (store.contentBlocks || []).filter(b => b.Location === 'homepage').sort((a,b)=>a.Order-b.Order);
            container.innerHTML = blocks.map(b => {
                const settings = JSON.parse(b.Settings || '{}');
                if (b.Type === 'hero_image') {
                    return `
                    <div class="relative h-[500px] rounded-[var(--radius)] overflow-hidden mb-12 flex items-center justify-center text-center text-white">
                        <img src="${settings.image || 'https://images.unsplash.com/photo-1497215728101-856f4ea42174'}" class="absolute inset-0 w-full h-full object-cover brightness-50">
                        <div class="relative z-10 p-6 max-w-2xl">
                            <h1 class="text-5xl md:text-7xl font-black mb-6 leading-tight">${escapeHtml(settings.caption)}</h1>
                            <p class="text-xl mb-10 opacity-90">${escapeHtml(settings.description)}</p>
                            <a href="${settings.buttonLink}" class="bg-white text-slate-900 px-10 py-4 rounded-full font-bold hover:scale-105 transition-transform inline-block">${escapeHtml(settings.buttonText)}</a>
                        </div>
                    </div>`;
                }
                if (b.Type === 'custom_html') return `<div class="mb-12">${settings}</div>`;
                return '';
            }).join('');
        }

        function renderProductList(container) {
            container.innerHTML = `
                <div class="flex flex-wrap gap-3 mb-10 items-center">
                    <span class="text-sm font-bold text-slate-400 uppercase tracking-wider">Categories:</span>
                    <button onclick="filterCat('all')" class="px-6 py-2 rounded-full border text-sm font-bold transition ${activeCategoryFilter==='all'?'btn-primary':'bg-white hover:bg-slate-50'}">All Products</button>
                    ${store.categories.map(c => `
                        <button onclick="filterCat('${c.ID}')" class="px-6 py-2 rounded-full border text-sm font-bold transition ${activeCategoryFilter==c.ID?'btn-primary':'bg-white hover:bg-slate-50'}">${escapeHtml(c.Name)}</button>
                    `).join('')}
                </div>
                <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-8">
                    ${store.products.filter(p => activeCategoryFilter === 'all' || p.Category == activeCategoryFilter).map(p => `
                        <div class="bg-white rounded-[var(--radius)] overflow-hidden shadow-sm border hover:shadow-xl transition-all group cursor-pointer" onclick="location.hash='#/product/${p.ID}'">
                            <div class="relative h-64 overflow-hidden">
                                <img src="${p.Thumbnail || 'https://placehold.co/600x400'}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                            </div>
                            <div class="p-6">
                                <h3 class="text-lg font-black group-hover:dynamic-text transition-colors">${escapeHtml(p.Title)}</h3>
                                <p class="text-slate-500 text-sm mt-2 line-clamp-2">${escapeHtml(p.Summary)}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
        }

        function renderProductDetail(container, id) {
            const p = store.products.find(x => x.ID == id);
            if (!p) return container.innerHTML = 'Product not found';
            container.innerHTML = `
                <div class="max-w-6xl mx-auto">
                    <button onclick="history.back()" class="mb-6 flex items-center gap-2 text-slate-500 font-bold hover:text-black">← BACK TO LIST</button>
                    <div class="grid lg:grid-cols-2 gap-12 items-start">
                        <div class="sticky top-24">
                            <img src="${p.Thumbnail}" class="w-full rounded-[var(--radius)] shadow-2xl">
                        </div>
                        <div>
                            <span class="text-xs font-black dynamic-text tracking-[0.2em] uppercase mb-2 block">Product Details</span>
                            <h1 class="text-5xl font-black mb-6 leading-tight">${escapeHtml(p.Title)}</h1>
                            <p class="text-xl text-slate-600 mb-8 leading-relaxed">${escapeHtml(p.Summary)}</p>
                            
                            <div class="space-y-8">
                                <div class="bg-white p-8 rounded-[var(--radius)] border shadow-sm">
                                    <h3 class="text-sm font-black uppercase tracking-widest mb-4">Technical Specifications</h3>
                                    <div class="text-slate-600 leading-relaxed whitespace-pre-line">${escapeHtml(p.TechInfo || 'Standard specifications apply.')}</div>
                                </div>
                                <div class="prose max-w-none text-slate-700">
                                    <h3 class="text-xl font-black mb-4">Description</h3>
                                    ${p.Description}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderPage(container, slug) {
            const p = store.pages.find(x => x.Slug === slug);
            if (!p) return container.innerHTML = 'Page not found';
            container.innerHTML = `
                <article class="max-w-4xl mx-auto py-10">
                    <h1 class="text-5xl font-black mb-10 text-center">${escapeHtml(p.Title)}</h1>
                    <div class="bg-white p-8 md:p-12 rounded-[var(--radius)] border shadow-sm prose lg:prose-xl max-w-none">
                        ${p.Content}
                    </div>
                </article>`;
        }

        // --- ADMIN PANEL (COMPLETE) ---
        function renderAdmin(container) {
            const token = localStorage.getItem('ws_token');
            if (!token) {
                container.innerHTML = `
                    <div class="max-w-md mx-auto bg-white p-10 rounded-[var(--radius)] shadow-2xl mt-20 border">
                        <h2 class="text-3xl font-black mb-2">Admin Login</h2>
                        <p class="text-slate-500 mb-8 text-sm font-medium">Please enter your credentials to manage the CMS.</p>
                        <div class="space-y-4">
                            <input id="admUser" placeholder="Username" class="w-full border p-4 rounded-2xl outline-none focus:border-black transition">
                            <input id="admPass" type="password" placeholder="Password" class="w-full border p-4 rounded-2xl outline-none focus:border-black transition">
                            <button onclick="adminLogin()" class="btn-primary w-full py-4 font-black text-lg shadow-lg hover:opacity-90 transition">SIGN IN</button>
                        </div>
                    </div>`;
                return;
            }

            container.innerHTML = `
                <div class="bg-white rounded-[var(--radius)] shadow-sm border p-8">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
                        <div>
                            <h1 class="text-3xl font-black">CMS Dashboard</h1>
                            <p class="text-slate-500 font-medium">Manage your website content and settings</p>
                        </div>
                        <button onclick="localStorage.removeItem('ws_token'); location.reload();" class="text-red-500 font-bold px-6 py-2 border border-red-100 rounded-full hover:bg-red-50 transition">LOGOUT SESSION</button>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                        <button onclick="openProductModal()" class="bg-slate-50 p-8 rounded-3xl border border-transparent hover:border-black hover:bg-white transition text-left group">
                            <span class="text-3xl block mb-2">📦</span>
                            <span class="font-black text-lg block group-hover:dynamic-text">Products</span>
                            <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">${store.products.length} Items</span>
                        </button>
                        <button onclick="openCategoryModal()" class="bg-slate-50 p-8 rounded-3xl border border-transparent hover:border-black hover:bg-white transition text-left group">
                            <span class="text-3xl block mb-2">📁</span>
                            <span class="font-black text-lg block group-hover:dynamic-text">Categories</span>
                            <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">${store.categories.length} Groups</span>
                        </button>
                    </div>
                </div>`;
        }

        async function adminLogin() {
            const u = document.getElementById('admUser').value;
            const p = document.getElementById('admPass').value;
            const res = await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'login', data:{ username:u, password:p } }) });
            const json = await res.json();
            if (json.status === 'success') { localStorage.setItem('ws_token', json.token); router(); } else { alert('Access Denied'); }
        }

        // --- MODALS ---
        window.openProductModal = () => {
            const modal = document.createElement('div');
            modal.id = "pModal";
            modal.className = "fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4";
            modal.innerHTML = `
                <div class="bg-white w-full max-w-5xl max-h-[90vh] overflow-y-auto rounded-[var(--radius)] p-8 shadow-2xl relative">
                    <button onclick="this.closest('#pModal').remove()" class="absolute top-6 right-6 text-2xl font-bold">✕</button>
                    <h2 class="text-3xl font-black mb-8">Product Manager</h2>
                    
                    <div class="space-y-4 mb-10">
                        ${store.products.map(p => `
                            <div class="flex items-center justify-between p-4 border rounded-2xl bg-slate-50">
                                <div class="flex items-center gap-4">
                                    <img src="${p.Thumbnail}" class="w-12 h-12 rounded-lg object-cover">
                                    <span class="font-black">${escapeHtml(p.Title)}</span>
                                </div>
                                <button onclick="deleteProductItem('${p.ID}')" class="text-red-500 font-bold hover:underline">Delete</button>
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-slate-50 p-8 rounded-3xl border-2 border-dashed border-slate-200">
                        <h3 class="text-xl font-black mb-6 uppercase tracking-wider">Add New Product</h3>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div class="space-y-4">
                                <label class="block text-xs font-black uppercase">Title</label>
                                <input id="p_title" class="w-full border p-4 rounded-xl">
                                
                                <label class="block text-xs font-black uppercase">Category</label>
                                <select id="p_cat" class="w-full border p-4 rounded-xl">
                                    ${store.categories.map(c => `<option value="${c.ID}">${c.Name}</option>`).join('')}
                                </select>
                                
                                <label class="block text-xs font-black uppercase">Thumbnail URL</label>
                                <div class="flex gap-2">
                                    <input id="p_thumb" class="flex-1 border p-4 rounded-xl text-xs">
                                    <input type="file" onchange="uploadImage(this, 'p_thumb')" class="hidden" id="f_thumb">
                                    <button onclick="document.getElementById('f_thumb').click()" class="bg-black text-white px-4 rounded-xl text-xs font-bold uppercase">Upload</button>
                                </div>
                            </div>
                            <div class="space-y-4">
                                <label class="block text-xs font-black uppercase">Short Summary</label>
                                <textarea id="p_summary" class="w-full border p-4 rounded-xl h-24"></textarea>
                                
                                <label class="block text-xs font-black uppercase">Technical Info</label>
                                <textarea id="p_tech" class="w-full border p-4 rounded-xl h-24"></textarea>
                            </div>
                            <div class="col-span-2">
                                <label class="block text-xs font-black uppercase mb-2">Detailed Description (HTML allowed)</label>
                                <textarea id="p_desc" class="w-full border p-4 rounded-xl h-40"></textarea>
                            </div>
                        </div>
                        <button onclick="saveNewProduct()" class="btn-primary w-full py-5 mt-8 font-black text-xl tracking-widest uppercase">Save Product to Database</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
        };

        window.saveNewProduct = async () => {
            const data = {
                title: document.getElementById('p_title').value,
                catId: document.getElementById('p_cat').value,
                thumb: document.getElementById('p_thumb').value,
                summary: document.getElementById('p_summary').value,
                tech: document.getElementById('p_tech').value,
                desc: document.getElementById('p_desc').value,
                id: "" // Empty ID tells backend to create new
            };
            if(!data.title) return alert('Title is required');
            await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'saveProduct', data }) });
            location.reload();
        };

        window.deleteProductItem = async (id) => {
            if(confirm('Permanently delete this product?')) {
                await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'deleteProduct', data:{id} }) });
                location.reload();
            }
        };

        window.openCategoryModal = () => {
            const modal = document.createElement('div');
            modal.id = "cModal";
            modal.className = "fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4";
            modal.innerHTML = `
                <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl relative">
                    <button onclick="this.closest('#cModal').remove()" class="absolute top-4 right-4 text-xl">✕</button>
                    <h2 class="text-2xl font-black mb-6">Manage Categories</h2>
                    <div class="space-y-3 mb-8">
                        ${store.categories.map(c => `
                            <div class="flex justify-between items-center p-3 border rounded-xl bg-slate-50">
                                <span class="font-bold">${escapeHtml(c.Name)}</span>
                                <button onclick="deleteCategoryItem('${c.ID}')" class="text-red-500 text-xs font-bold uppercase">Delete</button>
                            </div>
                        `).join('')}
                    </div>
                    <input id="new_c_name" placeholder="Category Name" class="w-full border p-4 rounded-xl mb-4">
                    <button onclick="saveCategory()" class="btn-primary w-full py-4 font-bold uppercase">Add Category</button>
                </div>`;
            document.body.appendChild(modal);
        };

        window.saveCategory = async () => {
            const name = document.getElementById('new_c_name').value;
            if(!name) return;
            await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'saveCategory', data:{ name } }) });
            location.reload();
        };

        window.deleteCategoryItem = async (id) => {
            if(confirm('Delete category?')) {
                await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'deleteCategory', data:{id} }) });
                location.reload();
            }
        };

        // --- UTILS & ROUTING ---
        window.filterCat = (id) => { activeCategoryFilter = id; renderProductList(document.getElementById('app')); };
        function escapeHtml(str) { if (!str) return ''; return str.toString().replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
        
        function renderFooter() {
            const f = Object.fromEntries((store.footer || []).map(i=>[i.Key,i.Value]));
            document.getElementById('siteFooter').innerHTML = `
                <div class="container mx-auto px-4 text-center">
                    <p class="font-black text-lg mb-4 uppercase tracking-[0.3em]">${document.getElementById('siteName').innerText}</p>
                    <p class="text-slate-400 font-medium text-sm">${escapeHtml(f.copyright_text || '© 2025 ALL RIGHTS RESERVED')}</p>
                </div>`;
        }

        function injectSeoMetaTags() {
            const s = Object.fromEntries((store.seoDefaults || []).map(i=>[i.Key,i.Value]));
            document.title = s.default_title || "WorkSmart CMS";
        }

        async function router() {
            const hash = location.hash || '#/';
            const app = document.getElementById('app');
            app.innerHTML = '<div class="flex justify-center py-20"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-black"></div></div>';
            
            if (hash === '#/') renderHome(app);
            else if (hash === '#/products') renderProductList(app);
            else if (hash.startsWith('#/product/')) renderProductDetail(app, hash.split('/')[2]);
            else if (hash.startsWith('#/page/')) renderPage(app, hash.split('/')[2]);
            else if (hash === '#/admin') renderAdmin(app);
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('load', fetchData);
    </script>
</body>
</html>

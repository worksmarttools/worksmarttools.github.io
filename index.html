<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSmart Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style id="theme-styles">
        :root { --primary-color: #2563eb; --base-font: 16px; }
        .dynamic-bg { background-color: var(--primary-color); }
        .dynamic-text { color: var(--primary-color); }
        .dynamic-border { border-color: var(--primary-color); }
        body { font-size: var(--base-font); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="bg-white/80 backdrop-blur-md shadow-sm p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.hash='#/'">
                <img id="site-logo" src="" class="h-8 hidden">
                <span id="site-name" class="text-xl font-black tracking-tighter">WORKS_MART</span>
            </div>
            <div id="nav-links" class="hidden md:flex space-x-8 font-semibold text-slate-600 text-sm uppercase tracking-widest">
                </div>
            <a href="#/admin-as" class="text-[10px] border px-3 py-1 rounded-full uppercase font-bold tracking-tighter hover:bg-black hover:text-white transition">Admin Portal</a>
        </div>
    </nav>

    <main id="app" class="container mx-auto p-6 min-h-screen"></main>

    <footer class="py-12 text-center text-slate-400 text-xs border-t bg-white">
        <p id="footer-text">&copy; WorkSmart Tools</p>
    </footer>

    <script>
        // 1. UPDATE THIS URL
        const API_URL = "https://script.google.com/macros/s/AKfycbz-1L3hT0vN0BKFf86Z2B6C6exRHLKRFS84Ox-SlSgxIzteddAAh981av7396VZbh89/exec";
        
        let store = { company: [], products: [] };

        // 2. ROUTING LOGIC
        window.addEventListener('hashchange', router);
        window.addEventListener('load', async () => {
            await fetchData();
            router();
        });

        async function fetchData() {
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getPublicData' })});
                store = await res.json();
                applyTheme();
            } catch (e) { console.error("Database connection failed."); }
        }

        function applyTheme() {
            const s = Object.fromEntries(store.company.map(i => [i.Key, i.Value]));
            document.title = s.site_title || "WorkSmart Tools";
            document.getElementById('site-name').innerText = s.company_name || "WorkSmart";
            
            const logo = document.getElementById('site-logo');
            if(s.logo_url) { logo.src = s.logo_url; logo.classList.remove('hidden'); }

            const root = document.documentElement;
            if(s.primary_color) root.style.setProperty('--primary-color', s.primary_color);
            if(s.font_size) root.style.setProperty('--base-font', s.font_size + "px");

            const menu = (s.menu_items || "Home").split(',').map(m => `<a href="#/" class="hover:dynamic-text transition">${m.trim()}</a>`).join('');
            document.getElementById('nav-links').innerHTML = menu;
        }

        function router() {
            const path = window.location.hash || '#/';
            const app = document.getElementById('app');

            if (path === '#/') renderHome(app);
            else if (path.startsWith('#/product/')) renderProduct(app, path.split('/')[2]);
            else if (path === '#/admin-as') renderAdmin(app);
        }

        // 3. HOME VIEW
        function renderHome(container) {
            const s = Object.fromEntries(store.company.map(i => [i.Key, i.Value]));
            container.innerHTML = `
                <section class="py-20 text-center">
                    <h1 class="text-6xl font-black mb-6 italic tracking-tighter">${s.site_title || 'WorkSmart'}</h1>
                    <p class="text-xl text-slate-500 max-w-xl mx-auto">${s.company_desc || ''}</p>
                </section>
                <div class="grid md:grid-cols-3 gap-10">
                    ${store.products.map(p => `
                        <div class="bg-white rounded-[2rem] overflow-hidden shadow-sm hover:shadow-2xl transition-all cursor-pointer group border border-slate-100" onclick="location.hash='#/product/${p.ID}'">
                            <img src="${p.Thumbnail}" class="w-full h-64 object-cover group-hover:scale-105 transition duration-500">
                            <div class="p-8">
                                <h3 class="font-black text-xl mb-3 uppercase">${p.Title}</h3>
                                <p class="text-slate-400 text-sm">${p.Summary}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 4. PRODUCT VIEW
        function renderProduct(container, id) {
            const p = store.products.find(x => x.ID == id);
            if(!p) return container.innerHTML = "Not Found";
            container.innerHTML = `
                <div class="max-w-4xl mx-auto py-10">
                    <button onclick="history.back()" class="mb-10 text-slate-400 font-bold hover:text-black uppercase text-xs tracking-widest">← Return to Collection</button>
                    <div class="grid md:grid-cols-2 gap-12">
                        <img src="${p.Thumbnail}" class="w-full rounded-[3rem] shadow-2xl">
                        <div>
                            <h1 class="text-5xl font-black mb-8 italic">${p.Title}</h1>
                            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 mb-6">
                                <h5 class="text-[10px] font-black text-slate-300 uppercase mb-4 tracking-widest">Specifications</h5>
                                <div class="text-sm leading-relaxed text-slate-600">${p.Technical_Info}</div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-16 prose max-w-none">
                        <h2 class="text-2xl font-black mb-6 border-b pb-4">Overview</h2>
                        <div class="text-lg text-slate-600 leading-relaxed">${p.Description}</div>
                    </div>
                </div>
            `;
        }

        // 5. ADMIN VIEW
        function renderAdmin(container) {
            const token = localStorage.getItem('ws_token');
            if(!token) {
                container.innerHTML = `
                    <div class="max-w-md mx-auto bg-white p-12 rounded-[2.5rem] shadow-xl mt-20 border">
                        <h2 class="text-3xl font-black mb-10 text-center tracking-tighter italic">ADMIN_LOGIN</h2>
                        <input id="u" placeholder="Username" class="w-full border-b py-4 mb-4 outline-none">
                        <input id="p" type="password" placeholder="Password" class="w-full border-b py-4 mb-10 outline-none">
                        <button onclick="login()" class="w-full dynamic-bg text-white p-5 rounded-2xl font-black shadow-lg">AUTHENTICATE</button>
                    </div>`;
            } else {
                const s = Object.fromEntries(store.company.map(i => [i.Key, i.Value]));
                container.innerHTML = `
                    <div class="flex justify-between items-end mb-16">
                        <h2 class="text-4xl font-black tracking-tighter">CONTROL_PANEL</h2>
                        <button onclick="logout()" class="text-xs font-bold text-red-500 hover:underline">TERMINATE_SESSION</button>
                    </div>

                    <div class="grid lg:grid-cols-2 gap-12 mb-20">
                        <div class="bg-white p-10 rounded-[2rem] border shadow-sm">
                            <h3 class="font-black text-lg mb-8 text-blue-600 italic">SITE_BRANDING</h3>
                            <input id="set_title" value="${s.site_title || ''}" placeholder="Site Title" class="w-full border-b py-3 mb-6 outline-none">
                            <input id="set_name" value="${s.company_name || ''}" placeholder="Company Name" class="w-full border-b py-3 mb-6 outline-none">
                            <textarea id="set_desc" placeholder="Global Description" class="w-full border-b py-3 mb-6 outline-none h-20">${s.company_desc || ''}</textarea>
                            <input id="set_logo" value="${s.logo_url || ''}" placeholder="Logo URL" class="w-full border-b py-3 outline-none">
                        </div>
                        <div class="bg-white p-10 rounded-[2rem] border shadow-sm">
                            <h3 class="font-black text-lg mb-8 text-purple-600 italic">UI_SYSTEM</h3>
                            <label class="text-[10px] font-black text-slate-300">ACCENT_COLOR</label>
                            <input id="set_color" type="color" value="${s.primary_color || '#2563eb'}" class="w-full h-12 mb-8 cursor-pointer border-none">
                            <input id="set_font" type="number" value="${s.font_size || '16'}" placeholder="Base Font (px)" class="w-full border-b py-3 mb-6 outline-none">
                            <input id="set_menu" value="${s.menu_items || ''}" placeholder="Menu (Comma Separated)" class="w-full border-b py-3 outline-none">
                        </div>
                    </div>
                    <button onclick="saveSettings()" class="bg-black text-white px-12 py-5 rounded-2xl font-black mb-20">COMMIT_CHANGES</button>

                    <div class="flex justify-between items-center mb-10">
                        <h2 class="text-2xl font-black">INVENTORY</h2>
                        <button onclick="showAddProduct()" class="dynamic-bg text-white px-8 py-3 rounded-xl font-black">+ NEW_PRODUCT</button>
                    </div>
                    <div class="bg-white rounded-3xl border overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 border-b">
                                <tr><th class="p-6 text-[10px] font-black">PRODUCT</th><th class="p-6 text-[10px] font-black">ACTION</th></tr>
                            </thead>
                            <tbody>
                                ${store.products.map(p => `
                                    <tr class="border-b last:border-0">
                                        <td class="p-6 font-bold text-sm">${p.Title}</td>
                                        <td class="p-6"><button onclick="deleteProduct('${p.ID}')" class="text-red-400 font-bold text-xs">DELETE</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }
        }

        // 6. ACTIONS
        async function login() {
            const res = await fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: 'login', data: { username: document.getElementById('u').value, password: document.getElementById('p').value } })
            });
            const data = await res.json();
            if(data.status === 'success') { localStorage.setItem('ws_token', data.token); router(); }
            else alert("Denied");
        }

        function logout() { localStorage.removeItem('ws_token'); router(); }

        async function saveSettings() {
            const data = {
                site_title: document.getElementById('set_title').value,
                company_name: document.getElementById('set_name').value,
                company_desc: document.getElementById('set_desc').value,
                logo_url: document.getElementById('set_logo').value,
                primary_color: document.getElementById('set_color').value,
                font_size: document.getElementById('set_font').value,
                menu_items: document.getElementById('set_menu').value
            };
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateSettings', data: data }) });
            location.reload();
        }

        function showAddProduct() {
            const html = `
                <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                    <div class="bg-white w-full max-w-4xl p-10 rounded-[2.5rem] max-h-[90vh] overflow-y-auto">
                        <h2 class="text-2xl font-black mb-10 italic">APPEND_INVENTORY</h2>
                        <div class="grid md:grid-cols-2 gap-8">
                            <input id="p_t" placeholder="Product Title" class="w-full border-b py-3 outline-none font-bold">
                            <input id="p_th" placeholder="Thumbnail URL" class="w-full border-b py-3 outline-none">
                            <textarea id="p_s" placeholder="Summary (Short)" class="w-full border-b py-3 outline-none"></textarea>
                            <textarea id="p_te" placeholder="Tech Specs (Bullet Points)" class="w-full border-b py-3 outline-none"></textarea>
                            <textarea id="p_d" placeholder="Full Description" class="md:col-span-2 w-full border-b py-3 outline-none h-32"></textarea>
                            <input id="p_st" placeholder="SEO Title" class="w-full border-b py-3 outline-none">
                            <input id="p_sd" placeholder="SEO Description" class="w-full border-b py-3 outline-none">
                        </div>
                        <div class="mt-12 flex gap-4">
                            <button onclick="submitProduct()" class="dynamic-bg text-white px-10 py-4 rounded-2xl font-black">PUBLISH</button>
                            <button onclick="document.getElementById('modal').remove()" class="bg-slate-100 px-10 py-4 rounded-2xl font-black">CANCEL</button>
                        </div>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        async function submitProduct() {
            const data = {
                title: document.getElementById('p_t').value,
                thumb: document.getElementById('p_th').value,
                summary: document.getElementById('p_s').value,
                tech: document.getElementById('p_te').value,
                desc: document.getElementById('p_d').value,
                seoT: document.getElementById('p_st').value,
                seoD: document.getElementById('p_sd').value
            };
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveProduct', data: data }) });
            location.reload();
        }

        async function deleteProduct(id) {
            if(!confirm("Erase from inventory?")) return;
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteProduct', data: {id} }) });
            location.reload();
        }
    </script>
</body>
</html>

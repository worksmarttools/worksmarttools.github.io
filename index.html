<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSmart Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style id="custom-styles">
        :root { --primary-color: #3b82f6; --base-font-size: 16px; }
        .dynamic-bg { background-color: var(--primary-color); }
        .dynamic-text { color: var(--primary-color); }
        .dynamic-border { border-color: var(--primary-color); }
        body { font-size: var(--base-font-size); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 transition-all duration-300">

    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.hash='#/'">
                <img id="site-logo" src="" class="h-10 hidden">
                <span id="site-name" class="text-xl font-bold">WorkSmart</span>
            </div>
            <div id="nav-links" class="hidden md:flex space-x-6 font-medium text-gray-600">
                </div>
            <a href="#/admin-as" class="text-xs bg-gray-100 px-3 py-1 rounded-full hover:bg-gray-200 transition">Admin</a>
        </div>
    </nav>

    <main id="app" class="container mx-auto p-6 min-h-screen"></main>

    <footer class="bg-white border-t mt-12 p-8 text-center text-gray-400 text-sm">
        <p id="footer-text">&copy; WorkSmart Tools</p>
    </footer>

    <script>
        /**
         * CONFIGURATION
         * Replace this URL with your published Apps Script Web App URL
         */
        const API_URL = "https://script.google.com/macros/s/AKfycbyOpPyGp47Xgbzg622pSKGdGTlXBFGsSCR8dZAbtBwhI8u5QMhpKcp7yKwP2bjBQaX8/exec";
        
        // Local Data Cache
        let store = { company: [], products: [], categories: [] };

        /**
         * ROUTER ENGINE
         * Monitors the URL Hash (#/) and switches views without refreshing the page
         */
        window.addEventListener('hashchange', router);
        window.addEventListener('load', async () => {
            await fetchData(); // Load data from Google Sheets on first visit
            router();
        });

        /**
         * DATA SYNC
         * Fetches the entire database from the Backend
         */
        async function fetchData() {
            try {
                const res = await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'getPublicData' })
                });
                store = await res.json();
                applyGlobalSettings(); // Apply the theme and logo immediately
            } catch (e) {
                console.error("Connection to Google Sheets failed.");
            }
        }

        /**
         * THEME ENGINE
         * Injects colors, fonts, and branding from the Spreadsheet into the UI
         */
        function applyGlobalSettings() {
            // Convert Key-Value pairs from Sheet to a JS Object
            const s = Object.fromEntries(store.company.map(i => [i.Key, i.Value]));
            
            // Branding
            document.title = s.site_title || "WorkSmart Tools";
            document.getElementById('site-name').innerText = s.company_name || "WorkSmart";
            document.getElementById('footer-text').innerText = `© ${new Date().getFullYear()} ${s.company_name || 'WorkSmart Tools'}`;
            
            const logo = document.getElementById('site-logo');
            if (s.logo_url) { logo.src = s.logo_url; logo.classList.remove('hidden'); }

            // Design System (CSS Variables)
            const root = document.documentElement;
            if (s.primary_color) root.style.setProperty('--primary-color', s.primary_color);
            if (s.font_size) root.style.setProperty('--base-font-size', s.font_size + "px");

            // Navigation Builder
            const menuHtml = (s.menu_items || "Home").split(',').map(item => `
                <a href="#/" class="hover:dynamic-text transition-colors">${item.trim()}</a>
            `).join('');
            document.getElementById('nav-links').innerHTML = menuHtml;
        }

        /**
         * VIEW CONTROLLER
         * Decides which HTML to show based on the URL path
         */
        function router() {
            const path = window.location.hash || '#/';
            const app = document.getElementById('app');

            if (path === '#/') renderHome(app);
            else if (path.startsWith('#/product/')) renderProduct(app, path.split('/')[2]);
            else if (path === '#/admin-as') renderAdmin(app);
            else app.innerHTML = "<h1 class='text-center py-20'>Page Not Found</h1>";
        }

        /**
         * HOME VIEW: Hero section and Product Gallery
         */
        function renderHome(container) {
            const s = Object.fromEntries(store.company.map(i => [i.Key, i.Value]));
            container.innerHTML = `
                <section class="text-center py-20 bg-white rounded-3xl shadow-sm mb-12 px-6">
                    <h1 class="text-5xl font-black mb-6 tracking-tight">${s.site_title || 'WorkSmart'}</h1>
                    <p class="text-xl text-gray-500 max-w-2xl mx-auto mb-10">${s.company_desc || ''}</p>
                    <button class="dynamic-bg text-white px-10 py-4 rounded-full font-bold shadow-xl hover:scale-105 transition transform">Explore Tools</button>
                </section>
                
                <h2 class="text-2xl font-bold mb-8 border-l-4 dynamic-border pl-4">Tool Catalog</h2>
                <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    ${store.products.map(p => `
                        <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-2xl transition-all cursor-pointer group" onclick="location.hash='#/product/${p.ID}'">
                            <img src="${p.Thumbnail}" class="w-full h-56 object-cover group-hover:scale-110 transition duration-500">
                            <div class="p-6">
                                <h3 class="font-bold text-xl mb-2">${p.Title}</h3>
                                <p class="text-gray-400 text-sm line-clamp-2">${p.Summary}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        /**
         * PRODUCT DETAIL VIEW: Dynamic Landing Page
         */
        function renderProduct(container, id) {
            const p = store.products.find(item => item.ID == id);
            if (!p) return container.innerHTML = "Product not found";
            
            container.innerHTML = `
                <div class="max-w-6xl mx-auto">
                    <button onclick="history.back()" class="mb-8 text-gray-400 hover:text-black">← Back to Gallery</button>
                    <div class="grid lg:grid-cols-2 gap-16 items-start">
                        <img src="${p.Thumbnail}" class="w-full rounded-3xl shadow-2xl">
                        <div>
                            <h1 class="text-5xl font-black mb-6">${p.Title}</h1>
                            <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                                <h4 class="text-xs font-black text-gray-300 uppercase tracking-widest mb-4">Technical Details</h4>
                                <div class="text-gray-600 leading-relaxed">${p.Technical_Info}</div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-20">
                        <h2 class="text-3xl font-bold mb-8">Full Description</h2>
                        <div class="prose max-w-none text-gray-600 text-lg leading-relaxed">${p.Description}</div>
                    </div>
                </div>
            `;
        }

        /**
         * ADMIN VIEW: Login & Management Panel
         */
        function renderAdmin(container) {
            const token = localStorage.getItem('ws_token');
            // If not logged in, show login form
            if (!token) {
                container.innerHTML = `
                    <div class="max-w-md mx-auto bg-white p-12 rounded-3xl shadow-2xl mt-10">
                        <h2 class="text-3xl font-bold mb-8 text-center">Admin Portal</h2>
                        <input id="adm_user" type="text" placeholder="Username" class="w-full border p-4 mb-4 rounded-xl outline-none focus:ring-2 dynamic-border">
                        <input id="adm_pass" type="password" placeholder="Password" class="w-full border p-4 mb-8 rounded-xl outline-none focus:ring-2 dynamic-border">
                        <button onclick="login()" class="w-full dynamic-bg text-white p-4 rounded-xl font-bold shadow-lg">Login</button>
                    </div>
                `;
            } else {
                // If logged in, show the Control Panel
                const s = Object.fromEntries(store.company.map(i => [i.Key, i.Value]));
                container.innerHTML = `
                    <div class="flex justify-between items-end mb-12">
                        <div>
                            <h2 class="text-4xl font-black">Design Console</h2>
                            <p class="text-gray-400">Manage your entire website design and branding</p>
                        </div>
                        <button onclick="logout()" class="text-red-500 font-bold hover:underline">Logout</button>
                    </div>

                    <div class="grid lg:grid-cols-2 gap-10">
                        <div class="bg-white p-10 rounded-3xl shadow-sm border border-gray-100">
                            <h3 class="font-bold text-xl mb-8 text-blue-500">Brand Identity</h3>
                            <label class="text-xs font-bold text-gray-400 uppercase">Site Title</label>
                            <input id="set_title" value="${s.site_title || ''}" class="w-full border-b py-3 mb-6 outline-none focus:dynamic-border">
                            
                            <label class="text-xs font-bold text-gray-400 uppercase">Company Name</label>
                            <input id="set_name" value="${s.company_name || ''}" class="w-full border-b py-3 mb-6 outline-none focus:dynamic-border">

                            <label class="text-xs font-bold text-gray-400 uppercase">Description</label>
                            <textarea id="set_desc" class="w-full border-b py-3 mb-6 outline-none focus:dynamic-border h-24">${s.company_desc || ''}</textarea>
                            
                            <label class="text-xs font-bold text-gray-400 uppercase">Logo URL</label>
                            <input id="set_logo" value="${s.logo_url || ''}" class="w-full border-b py-3 outline-none focus:dynamic-border">
                        </div>

                        <div class="bg-white p-10 rounded-3xl shadow-sm border border-gray-100">
                            <h3 class="font-bold text-xl mb-8 text-purple-500">Visual Settings</h3>
                            <label class="text-xs font-bold text-gray-400 uppercase">Primary Color</label>
                            <input id="set_color" type="color" value="${s.primary_color || '#3b82f6'}" class="w-full h-12 mb-8 rounded-lg cursor-pointer">

                            <label class="text-xs font-bold text-gray-400 uppercase">Global Font Size (px)</label>
                            <input id="set_font" type="number" value="${s.font_size || '16'}" class="w-full border-b py-3 mb-6 outline-none focus:dynamic-border">

                            <label class="text-xs font-bold text-gray-400 uppercase">Menu Items (Split by Comma)</label>
                            <input id="set_menu" value="${s.menu_items || ''}" class="w-full border-b py-3 outline-none focus:dynamic-border">
                        </div>
                    </div>

                    <div class="mt-12">
                        <button onclick="saveAllSettings()" class="bg-black text-white px-16 py-5 rounded-2xl font-bold shadow-2xl hover:scale-105 transition transform w-full md:w-auto">
                            Publish Changes to Live Site
                        </button>
                    </div>
                `;
            }
        }

        /**
         * ACTIONS: LOGIN
         */
        async function login() {
            const username = document.getElementById('adm_user').value;
            const password = document.getElementById('adm_pass').value;
            const res = await fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: 'login', data: { username, password } })
            });
            const result = await res.json();
            if (result.status === 'success') {
                localStorage.setItem('ws_token', result.token);
                router();
            } else alert("Invalid Admin Login");
        }

        /**
         * ACTIONS: LOGOUT
         */
        function logout() {
            localStorage.removeItem('ws_token');
            router();
        }

        /**
         * ACTIONS: SAVE SETTINGS
         * Collects values from the Admin Panel and sends them to Google Sheets
         */
        async function saveAllSettings() {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "Connecting to Google Sheets...";
            btn.disabled = true;

            const data = {
                site_title: document.getElementById('set_title').value,
                company_name: document.getElementById('set_name').value,
                company_desc: document.getElementById('set_desc').value,
                logo_url: document.getElementById('set_logo').value,
                primary_color: document.getElementById('set_color').value,
                font_size: document.getElementById('set_font').value,
                menu_items: document.getElementById('set_menu').value
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'updateSettings', data: data })
                });
                
                if ((await res.json()).status === 'success') {
                    alert("Sync Complete! The site has been updated.");
                    location.reload(); // Refresh to apply all new data
                }
            } catch (err) {
                alert("Error saving data.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>

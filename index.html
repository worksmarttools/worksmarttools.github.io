<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSmart Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
        .active-route { display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <nav class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 id="site-logo" class="text-xl font-bold cursor-pointer" onclick="navigate('/')">WorkSmart</h1>
            <div id="nav-links">
                <a href="#/" class="px-3">Home</a>
                <a href="#/admin-as" class="px-3 text-blue-600">Admin</a>
            </div>
        </div>
    </nav>

    <main id="app" class="container mx-auto p-6"></main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwhuZ1kM6GbRhlqRfZo20BWSdanAeTu0ZvCmfEadlf3U-wYac7ylJJUNzgFwYWN19bN/exec";
        let store = { company: [], products: [], categories: [] };

        // --- Router ---
        window.addEventListener('hashchange', router);
        window.addEventListener('load', async () => {
            await fetchData();
            router();
        });

        async function fetchData() {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getPublicData' })});
            store = await res.json();
            document.title = store.company.find(c => c.Key === 'site_title')?.Value || "WorkSmart Tools";
        }

        function router() {
            const path = window.location.hash || '#/';
            const app = document.getElementById('app');

            if (path === '#/') renderHome(app);
            else if (path.startsWith('#/product/')) renderProduct(app, path.split('/')[2]);
            else if (path === '#/admin-as') renderAdmin(app);
            else app.innerHTML = "404 Not Found";
        }

        // --- Views ---
        function renderHome(container) {
            const company = Object.fromEntries(store.company.map(i => [i.Key, i.Value]));
            container.innerHTML = `
                <section class="text-center py-12">
                    <h2 class="text-4xl font-bold">${company.site_title || 'WorkSmart'}</h2>
                    <p class="mt-4 text-gray-600">${company.moto || 'Smart tools for smart people.'}</p>
                </section>
                <div class="grid md:grid-cols-3 gap-6">
                    ${store.products.map(p => `
                        <div class="bg-white p-4 rounded shadow hover:shadow-lg cursor-pointer" onclick="location.hash='#/product/${p.ID}'">
                            <img src="${p.Thumbnail}" class="w-full h-48 object-cover rounded">
                            <h3 class="font-bold mt-2">${p.Title}</h3>
                            <p class="text-sm text-gray-500">${p.Summary}</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderProduct(container, id) {
            const p = store.products.find(item => item.ID == id);
            if (!p) return container.innerHTML = "Product not found";
            
            container.innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <button onclick="history.back()" class="mb-4 text-blue-500">← Back</button>
                    <div class="grid md:grid-cols-2 gap-8">
                        <img src="${p.Thumbnail}" class="w-full rounded-lg shadow">
                        <div>
                            <h1 class="text-3xl font-bold">${p.Title}</h1>
                            <div class="mt-4 p-4 bg-gray-100 rounded">${p.Technical_Info}</div>
                        </div>
                    </div>
                    <div class="mt-8 prose max-w-none">
                        <h2 class="text-xl font-bold border-b pb-2">Description</h2>
                        <p class="mt-2">${p.Description}</p>
                        <h2 class="text-xl font-bold border-b pb-2 mt-6">Terms & Privacy</h2>
                        <p class="text-sm text-gray-600">${p.Terms}</p>
                    </div>
                </div>
            `;
        }

        function renderAdmin(container) {
            const token = localStorage.getItem('ws_token');
            if (!token) {
                container.innerHTML = `
                    <div class="max-w-sm mx-auto bg-white p-6 rounded shadow">
                        <h2 class="text-xl font-bold mb-4">Admin Login</h2>
                        <input id="adm_user" type="text" placeholder="Username" class="w-full border p-2 mb-2">
                        <input id="adm_pass" type="password" placeholder="Password" class="w-full border p-2 mb-4">
                        <button onclick="login()" class="w-full bg-black text-white p-2">Login</button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <h2 class="text-2xl font-bold mb-4">Admin Dashboard</h2>
                    <button onclick="logout()" class="text-red-500 mb-6">Logout</button>
                    <div class="bg-white p-6 rounded shadow mb-6">
                        <h3 class="font-bold border-b mb-4">Site Information</h3>
                        <input id="set_title" placeholder="Site Title" class="block border p-2 mb-2 w-full">
                        <button onclick="saveSettings()" class="bg-blue-600 text-white px-4 py-2">Update Info</button>
                    </div>
                    `;
            }
        }

        // --- Actions ---
        async function login() {
            const username = document.getElementById('adm_user').value;
            const password = document.getElementById('adm_pass').value;
            const res = await fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: 'login', data: { username, password } })
            });
            const result = await res.json();
            if (result.status === 'success') {
                localStorage.setItem('ws_token', result.token);
                router();
            } else alert("Invalid Login");
        }

        function logout() {
            localStorage.removeItem('ws_token');
            router();
        }

        function navigate(path) {
            location.hash = path;
        }
    </script>
</body>
</html>

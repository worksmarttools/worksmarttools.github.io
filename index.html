<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSmart CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --radius: 1rem; --bg: #f8fafc; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; }
        .btn-primary { background: var(--primary); color: white; border-radius: var(--radius); transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; }
        .dynamic-text { color: var(--primary); }
        .tab-active { border-bottom: 2px solid var(--primary); color: var(--primary); font-weight: bold; }
        .dropdown:hover .dropdown-menu { display: block; }
    </style>
</head>
<body>
    <!-- Dynamic Navbar (no admin button for public) -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.hash='#/'">
                <img id="siteLogo" src="" class="h-8 hidden">
                <span id="siteName" class="text-xl font-black dynamic-text">WORKSMART</span>
            </div>
            <div id="mainMenu" class="hidden md:flex items-center gap-6"></div>
        </div>
    </nav>

    <main id="app" class="container mx-auto px-4 py-6 min-h-screen"></main>

    <footer id="siteFooter" class="text-center py-8 border-t mt-12 text-slate-500 text-sm"></footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzpPyRxUGaOgeaodFNDWnM9xB4VKDjR8wZLfGJPQ9SJppfXVstKM_D7tg5lcf-TtMNr/exec"; // 🔁 REPLACE WITH YOUR DEPLOYED URL
        let store = { company: [], products: [], categories: [], pages: [], contentBlocks: [], theme: [], seoDefaults: [] };
        let activeCategoryFilter = "all";

        async function fetchData() {
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getPublicData' }) });
                const json = await res.json();
                store = json.data;
                applyTheme();
                buildHierarchicalMenu();
                renderFooter();
                router();
            } catch(e) { console.error(e); }
        }

        function applyTheme() {
            const t = Object.fromEntries((store.theme || []).map(i=>[i.Key,i.Value]));
            document.documentElement.style.setProperty('--primary', t.primary_color || '#0f172a');
            document.documentElement.style.setProperty('--radius', (t.card_radius || 16)+'px');
            document.body.style.backgroundColor = t.body_bg || '#f8fafc';
            document.body.style.fontSize = (t.base_font_size || 16)+'px';
            if(t.font_family) document.body.style.fontFamily = t.font_family;
            const company = Object.fromEntries((store.company || []).map(i=>[i.Key,i.Value]));
            document.getElementById('siteName').innerText = company.company_name || "WORKSMART";
            const logo = document.getElementById('siteLogo');
            if(company.logo_url && company.logo_url.trim()) { logo.src = company.logo_url; logo.classList.remove('hidden'); }
        }

        function buildHierarchicalMenu() {
            const pages = (store.pages || []).filter(p => p.Status === 'published');
            const menuContainer = document.getElementById('mainMenu');
            if (!menuContainer) return;
            const tree = [];
            const map = {};
            pages.forEach(p => { map[p.ID] = { ...p, children: [] }; });
            pages.forEach(p => {
                if (p.ParentID && map[p.ParentID]) map[p.ParentID].children.push(map[p.ID]);
                else tree.push(map[p.ID]);
            });
            function renderTree(items) {
                let html = '';
                items.forEach(item => {
                    const hasChildren = item.children.length > 0;
                    html += `<div class="relative group">
                        <a href="#/page/${item.Slug}" class="block px-4 py-2 text-sm font-medium hover:dynamic-text">${escapeHtml(item.Title)}</a>
                        ${hasChildren ? `<div class="absolute left-0 top-full hidden group-hover:block bg-white shadow-lg rounded-md min-w-40 z-50">${renderTree(item.children)}</div>` : ''}
                    </div>`;
                });
                return html;
            }
            let menuHtml = `<a href="#/" class="px-3 py-2 text-sm font-medium hover:dynamic-text">HOME</a>`;
            menuHtml += renderTree(tree);
            menuHtml += `<a href="#/products" class="px-3 py-2 text-sm font-medium hover:dynamic-text">PRODUCTS</a>`;
            menuContainer.innerHTML = menuHtml;
        }

        function renderFooter() {
            const footerBlock = (store.contentBlocks || []).find(b => b.BlockName === 'footer' && b.Location === 'global');
            const footerEl = document.getElementById('siteFooter');
            if (footerBlock) footerEl.innerHTML = footerBlock.Content;
            else footerEl.innerHTML = '© WorkSmart CMS';
        }

        function getBlocksByLocation(location) {
            return (store.contentBlocks || []).filter(b => b.Location === location).sort((a,b)=>a.Order-b.Order);
        }

        function renderHome(container) {
            const blocks = getBlocksByLocation('homepage');
            if (blocks.length === 0) {
                container.innerHTML = `<div class="text-center py-20">No content blocks found. Go to Admin → Content Blocks and add blocks with Location = "homepage".</div>`;
                return;
            }
            let html = '';
            blocks.forEach(block => {
                if (block.Type === 'html') html += block.Content;
                else if (block.Type === 'text') html += `<div class="prose max-w-none my-6">${block.Content}</div>`;
                else if (block.Type === 'image') html += `<img src="${block.Content}" class="w-full rounded-2xl my-6">`;
            });
            container.innerHTML = html;
        }

        function renderProductList(container) {
            const filtered = activeCategoryFilter === "all" ? store.products : store.products.filter(p => p.Category == activeCategoryFilter);
            const cats = store.categories.length ? store.categories : [{ID:"general", Name:"General"}];
            container.innerHTML = `
                <div class="flex flex-wrap gap-3 justify-center border-b pb-6 mb-8">
                    <button data-cat="all" class="cat-pill px-5 py-2 rounded-full text-sm font-medium bg-slate-100 hover:dynamic-bg hover:text-white transition">ALL</button>
                    ${cats.map(c => `<button data-cat="${c.ID}" class="cat-pill px-5 py-2 rounded-full text-sm font-medium bg-slate-100 hover:dynamic-bg hover:text-white transition">${escapeHtml(c.Name.toUpperCase())}</button>`).join('')}
                </div>
                <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    ${filtered.length ? filtered.map(p => `
                        <div class="bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition cursor-pointer" onclick="location.hash='#/product/${p.ID}'">
                            <img src="${p.Thumbnail || 'https://placehold.co/600x400?text=No+Image'}" class="w-full h-56 object-cover">
                            <div class="p-5">
                                <div class="text-xs dynamic-text font-bold mb-1">${getCategoryName(p.Category)}</div>
                                <h3 class="text-xl font-extrabold">${escapeHtml(p.Title)}</h3>
                                <p class="text-slate-500 text-sm mt-2 line-clamp-2">${escapeHtml(p.Summary)}</p>
                            </div>
                        </div>
                    `).join('') : '<div class="col-span-full text-center py-20 text-slate-400">No products found.</div>'}
                </div>
            `;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                btn.onclick = () => { activeCategoryFilter = btn.getAttribute('data-cat'); renderProductList(container); };
                if (activeCategoryFilter === btn.getAttribute('data-cat')) btn.classList.add('dynamic-bg', 'text-white');
                else btn.classList.remove('dynamic-bg', 'text-white');
            });
        }

        function renderProductDetail(container, id) {
            const p = store.products.find(x => x.ID == id);
            if (!p) { container.innerHTML = '<div class="text-center py-20">Product not found</div>'; return; }
            const images = p.Images ? p.Images.split(',').map(i => i.trim()) : (p.Thumbnail ? [p.Thumbnail] : []);
            const swiperId = `swiper-${Date.now()}`;
            container.innerHTML = `
                <div class="max-w-6xl mx-auto">
                    <button onclick="history.back()" class="mb-6 text-slate-400 hover:dynamic-text text-sm">← Back</button>
                    <div class="grid md:grid-cols-2 gap-10">
                        <div class="relative rounded-2xl overflow-hidden shadow-xl">
                            <div class="swiper ${swiperId}">
                                <div class="swiper-wrapper">${images.map(img => `<div class="swiper-slide"><img src="${img}" class="w-full h-96 object-cover"></div>`).join('')}</div>
                                <div class="swiper-button-next"></div><div class="swiper-button-prev"></div><div class="swiper-pagination"></div>
                            </div>
                        </div>
                        <div><h1 class="text-4xl font-black dynamic-text">${escapeHtml(p.Title)}</h1><div class="mt-6 bg-white p-5 rounded-2xl shadow-sm"><h4 class="font-bold">Technical Info</h4><div class="text-slate-600 text-sm whitespace-pre-line mt-2">${escapeHtml(p.Technical_Info || 'No data')}</div></div></div>
                    </div>
                    <div class="mt-16 grid md:grid-cols-2 gap-8">
                        <div class="bg-white p-6 rounded-2xl shadow"><h3 class="font-bold text-xl">Description</h3><div class="mt-3 text-slate-600">${escapeHtml(p.Description || '')}</div></div>
                        <div class="space-y-6">${p.Terms ? `<div class="bg-white p-6 rounded-2xl"><h3 class="font-bold">Terms</h3><div class="text-sm text-slate-500">${escapeHtml(p.Terms)}</div></div>` : ''}${p.Privacy ? `<div class="bg-white p-6 rounded-2xl"><h3 class="font-bold">Privacy</h3><div class="text-sm text-slate-500">${escapeHtml(p.Privacy)}</div></div>` : ''}</div>
                    </div>
                </div>
            `;
            setTimeout(() => { new Swiper(`.${swiperId}`, { navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }, pagination: { el: '.swiper-pagination', clickable: true }, loop: images.length > 1 }); }, 50);
        }

        function renderPage(container, slug) {
            const page = store.pages.find(p => p.Slug === slug);
            if (!page) { container.innerHTML = '<div class="text-center py-20">Page not found</div>'; return; }
            container.innerHTML = `<div class="max-w-4xl mx-auto prose prose-lg">${page.Content || '<p>No content.</p>'}</div>`;
        }

        function getCategoryName(catId) {
            const cat = store.categories.find(c => c.ID == catId);
            return cat ? cat.Name : (catId === "general" ? "General" : catId);
        }

        // ======================== ADMIN PANEL ========================
        function renderAdmin(container) {
            const token = localStorage.getItem('ws_token');
            if (!token) {
                container.innerHTML = `<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow mt-12"><h2 class="text-2xl font-black mb-4">Admin Login</h2><input id="admUser" class="w-full border p-3 rounded mb-3" placeholder="Username"><input id="admPass" type="password" class="w-full border p-3 rounded mb-5" placeholder="Password"><button onclick="adminLogin()" class="btn-primary w-full py-3 rounded">Login</button></div>`;
                return;
            }
            container.innerHTML = `
                <div class="flex justify-between items-center mb-6"><h1 class="text-3xl font-black">Admin Console</h1><button onclick="adminLogout()" class="text-red-500 border px-4 py-1 rounded-full text-sm">Logout</button></div>
                <div class="flex flex-wrap gap-2 border-b mb-6">
                    <button data-tab="site" class="tab-btn px-4 py-2">Site & Theme</button>
                    <button data-tab="blocks" class="tab-btn px-4 py-2">Content Blocks</button>
                    <button data-tab="pages" class="tab-btn px-4 py-2">Pages (Menu)</button>
                    <button data-tab="products" class="tab-btn px-4 py-2">Products</button>
                    <button data-tab="seo" class="tab-btn px-4 py-2">SEO</button>
                </div>
                <div id="tabContent"></div>
            `;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => loadTab(btn.innerText.toLowerCase().includes('site')?'site':btn.innerText.toLowerCase().includes('blocks')?'blocks':btn.innerText.toLowerCase().includes('pages')?'pages':btn.innerText.toLowerCase().includes('products')?'products':'seo'));
            loadTab('site');
        }

        async function loadTab(tab) {
            const div = document.getElementById('tabContent');
            if (!div) return;
            if (tab === 'site') {
                const theme = Object.fromEntries((store.theme || []).map(i=>[i.Key,i.Value]));
                const company = Object.fromEntries((store.company || []).map(i=>[i.Key,i.Value]));
                div.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow space-y-4"><h3 class="font-black">Theme</h3><div class="grid md:grid-cols-2 gap-3"><label>Primary Color</label><input type="color" id="primary_color" value="${theme.primary_color||'#0f172a'}"><label>Body BG</label><input type="color" id="body_bg" value="${theme.body_bg||'#f8fafc'}"><label>Card Radius (px)</label><input type="number" id="card_radius" value="${theme.card_radius||16}"><label>Base Font (px)</label><input type="number" id="base_font_size" value="${theme.base_font_size||16}"><label>Font Family</label><input id="font_family" value="${theme.font_family||'Inter'}"></div><button onclick="saveTheme()" class="btn-primary px-4 py-2 rounded">Save Theme</button></div>
                    <div class="bg-white p-6 rounded-2xl shadow mt-6"><h3 class="font-black">Company Info</h3><div class="grid md:grid-cols-2 gap-3">${Object.entries(company).map(([k,v])=>`<div><label>${k}</label><input id="comp_${k}" value="${escapeHtml(v)}" class="w-full border p-2 rounded"></div>`).join('')}</div><button onclick="saveCompanyInfo()" class="btn-primary px-4 py-2 rounded mt-4">Save Company</button></div>
                `;
            } else if (tab === 'blocks') {
                div.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow"><div id="blocksList"></div><button onclick="openBlockModal()" class="btn-primary px-4 py-2 rounded mt-4">+ Add Block</button></div>`;
                renderBlocksList();
            } else if (tab === 'pages') {
                div.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow"><div id="pagesList"></div><button onclick="openPageModal()" class="btn-primary px-4 py-2 rounded mt-4">+ New Page</button></div>`;
                renderPagesList();
            } else if (tab === 'products') {
                div.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow"><button onclick="openProductModal()" class="bg-emerald-600 text-white px-4 py-2 rounded mb-4">+ New Product</button><div id="productsTable"></div></div>`;
                renderProductsTable();
            } else if (tab === 'seo') {
                const seo = Object.fromEntries((store.seoDefaults || []).map(i=>[i.Key,i.Value]));
                div.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow space-y-3"><h3 class="font-black">Global SEO</h3><input id="seo_title" placeholder="Default Title" value="${seo.default_title||''}" class="w-full border p-2 rounded"><textarea id="seo_desc" placeholder="Default Description" class="w-full border p-2 rounded">${seo.default_description||''}</textarea><input id="seo_ogimage" placeholder="Default OG Image" value="${seo.default_og_image||''}" class="w-full border p-2 rounded"><button onclick="saveSeo()" class="btn-primary px-4 py-2 rounded">Save SEO</button></div>`;
            }
        }

        function renderBlocksList() {
            const blocks = store.contentBlocks || [];
            const container = document.getElementById('blocksList');
            if (!container) return;
            container.innerHTML = blocks.map(b => `
                <div class="border-b py-3 flex justify-between"><div><b>${escapeHtml(b.BlockName)}</b> (${b.Type} | ${b.Location})<br><div class="text-xs text-slate-500">${escapeHtml(b.Content?.substring(0,80))}...</div></div><div><button onclick="editBlock('${b.BlockID}')" class="text-blue-500 mr-2">Edit</button><button onclick="deleteBlock('${b.BlockID}')" class="text-red-500">Delete</button></div></div>
            `).join('');
        }

        function renderPagesList() {
            const pages = store.pages || [];
            const container = document.getElementById('pagesList');
            if (!container) return;
            container.innerHTML = pages.map(p => `
                <div class="border-b py-3 flex justify-between"><div><b>${escapeHtml(p.Title)}</b> /${p.Slug} ${p.ParentID ? '(child)' : ''}</div><div><button onclick="editPage('${p.ID}')" class="text-blue-500 mr-2">Edit</button><button onclick="deletePage('${p.ID}')" class="text-red-500">Delete</button></div></div>
            `).join('');
        }

        function renderProductsTable() {
            const container = document.getElementById('productsTable');
            if (!container) return;
            container.innerHTML = `<table class="w-full text-sm"><thead class="bg-slate-100"><tr><th class="p-3 text-left">Title</th><th>Category</th><th class="text-right">Actions</th></tr></thead><tbody>${store.products.map(p => `<tr class="border-b"><td class="p-3">${escapeHtml(p.Title)}</td><td>${getCategoryName(p.Category)}</td><td class="text-right"><button onclick="openProductModal('${p.ID}')" class="text-blue-500 mr-2">Edit</button><button onclick="deleteProductItem('${p.ID}')" class="text-red-500">Delete</button></td></tr>`).join('')}</tbody></table>`;
        }

        // ======================== CRUD ACTIONS ========================
        window.adminLogin = async () => {
            const res = await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'login', data:{ username:document.getElementById('admUser').value, password:document.getElementById('admPass').value } }) });
            const json = await res.json();
            if (json.status === 'success') { localStorage.setItem('ws_token', json.token); router(); } else alert('Invalid credentials');
        };
        window.adminLogout = () => { localStorage.removeItem('ws_token'); router(); };

        window.saveTheme = async () => {
            const data = { primary_color: document.getElementById('primary_color')?.value, body_bg: document.getElementById('body_bg')?.value, card_radius: document.getElementById('card_radius')?.value, base_font_size: document.getElementById('base_font_size')?.value, font_family: document.getElementById('font_family')?.value };
            await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'updateTheme', data }) });
            location.reload();
        };
        window.saveCompanyInfo = async () => {
            const data = {}; document.querySelectorAll('[id^="comp_"]').forEach(inp => { data[inp.id.replace('comp_','')] = inp.value; });
            await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'updateSettings', data }) });
            location.reload();
        };
        window.saveSeo = async () => {
            const data = { default_title: document.getElementById('seo_title')?.value, default_description: document.getElementById('seo_desc')?.value, default_og_image: document.getElementById('seo_ogimage')?.value };
            await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'updateSeoDefaults', data }) });
            location.reload();
        };

        // Content Blocks
        window.openBlockModal = (id=null) => {
            const block = id ? store.contentBlocks.find(b => b.BlockID == id) : { BlockID:'', BlockName:'', Type:'html', Content:'', Order:0, Location:'homepage' };
            const html = `<div id="blockModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4"><div class="bg-white w-full max-w-2xl rounded-2xl p-6"><h3 class="text-2xl font-black mb-4">${id ? 'Edit Block' : 'New Block'}</h3><input type="hidden" id="block_id" value="${block.BlockID}"><input id="block_name" placeholder="Block Name (e.g., hero)" value="${escapeHtml(block.BlockName)}" class="w-full border p-3 rounded mb-3"><select id="block_type" class="w-full border p-3 rounded mb-3"><option value="html" ${block.Type==='html'?'selected':''}>HTML</option><option value="text" ${block.Type==='text'?'selected':''}>Text</option><option value="image" ${block.Type==='image'?'selected':''}>Image URL</option></select><textarea id="block_content" rows="8" class="w-full border p-3 rounded mb-3" placeholder="HTML or text or image URL">${escapeHtml(block.Content)}</textarea><input id="block_order" type="number" placeholder="Order" value="${block.Order}" class="w-full border p-3 rounded mb-3"><select id="block_location" class="w-full border p-3 rounded mb-4"><option value="homepage" ${block.Location==='homepage'?'selected':''}>Homepage</option><option value="global" ${block.Location==='global'?'selected':''}>Global (footer)</option></select><div class="flex gap-3"><button onclick="submitBlock()" class="btn-primary px-6 py-2 rounded">Save</button><button onclick="closeModal('blockModal')" class="bg-slate-200 px-6 py-2 rounded">Cancel</button></div></div></div>`;
            document.body.insertAdjacentHTML('beforeend', html);
        };
        window.submitBlock = async () => {
            const data = { id: document.getElementById('block_id').value, blockName: document.getElementById('block_name').value, type: document.getElementById('block_type').value, content: document.getElementById('block_content').value, order: document.getElementById('block_order').value, location: document.getElementById('block_location').value };
            await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'saveContentBlock', data }) });
            location.reload();
        };
        window.editBlock = (id) => openBlockModal(id);
        window.deleteBlock = async (id) => { if(confirm('Delete block?')) { await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'deleteContentBlock', data:{id} }) }); location.reload(); } };

        // Pages
        window.openPageModal = (id=null) => {
            const page = id ? store.pages.find(p => p.ID == id) : { ID:'', Slug:'', Title:'', Content:'', MenuOrder:0, Status:'published', ParentID:'' };
            const parentOptions = `<option value="">None (Root)</option>` + (store.pages || []).filter(p => p.ID !== page.ID).map(p => `<option value="${p.ID}" ${page.ParentID===p.ID?'selected':''}>${escapeHtml(p.Title)}</option>`).join('');
            const html = `<div id="pageModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4"><div class="bg-white w-full max-w-3xl rounded-2xl p-6"><h3 class="text-2xl font-black mb-4">${id ? 'Edit Page' : 'New Page'}</h3><input type="hidden" id="page_id" value="${page.ID}"><input id="page_title" placeholder="Title" value="${escapeHtml(page.Title)}" class="w-full border p-3 rounded mb-3"><input id="page_slug" placeholder="Slug (URL)" value="${escapeHtml(page.Slug)}" class="w-full border p-3 rounded mb-3"><select id="page_parent" class="w-full border p-3 rounded mb-3">${parentOptions}</select><input id="page_order" type="number" placeholder="Menu Order" value="${page.MenuOrder}" class="w-full border p-3 rounded mb-3"><select id="page_status" class="w-full border p-3 rounded mb-3"><option value="published" ${page.Status==='published'?'selected':''}>Published</option><option value="draft" ${page.Status==='draft'?'selected':''}>Draft</option></select><textarea id="page_content" rows="8" class="w-full border p-3 rounded mb-4" placeholder="HTML content">${escapeHtml(page.Content)}</textarea><div class="flex gap-3"><button onclick="submitPage()" class="btn-primary px-6 py-2 rounded">Save</button><button onclick="closeModal('pageModal')" class="bg-slate-200 px-6 py-2 rounded">Cancel</button></div></div></div>`;
            document.body.insertAdjacentHTML('beforeend', html);
        };
        window.submitPage = async () => {
            const data = { id: document.getElementById('page_id').value, title: document.getElementById('page_title').value, slug: document.getElementById('page_slug').value, parentId: document.getElementById('page_parent').value, menuOrder: document.getElementById('page_order').value, status: document.getElementById('page_status').value, content: document.getElementById('page_content').value };
            await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'savePage', data }) });
            location.reload();
        };
        window.editPage = (id) => openPageModal(id);
        window.deletePage = async (id) => { if(confirm('Delete page?')) { await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'deletePage', data:{id} }) }); location.reload(); } };

        // Products with image upload
        window.openProductModal = (id=null) => {
            const prod = id ? store.products.find(p => p.ID == id) : { ID:'', Category: store.categories[0]?.ID || 'general', Title:'', Thumbnail:'', Images:'', Summary:'', Description:'', Technical_Info:'', Terms:'', Privacy:'', ServiceCommitment:'', SEOTitle:'', SEODesc:'', SEOKeywords:'', OGTitle:'', OGDesc:'', OGImage:'', TwitterCard:'summary_large_image' };
            const catOptions = store.categories.map(c => `<option value="${c.ID}" ${prod.Category===c.ID?'selected':''}>${escapeHtml(c.Name)}</option>`).join('');
            const modalHtml = `<div id="productModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4 overflow-auto"><div class="bg-white w-full max-w-5xl rounded-2xl p-6 max-h-[90vh] overflow-y-auto"><h3 class="text-2xl font-black mb-4">${id ? 'Edit Product' : 'New Product'}</h3><input type="hidden" id="prod_id" value="${prod.ID}"><div class="grid md:grid-cols-2 gap-4"><div><label>Title</label><input id="prod_title" value="${escapeHtml(prod.Title)}" class="w-full border p-2 rounded mb-2"><label>Category</label><select id="prod_cat" class="w-full border p-2 rounded mb-2">${catOptions}</select><label>Thumbnail URL</label><input id="prod_thumb" value="${escapeHtml(prod.Thumbnail)}" class="w-full border p-2 rounded mb-2"><div class="flex gap-2 mb-2"><input type="file" id="thumbUpload" accept="image/*" class="text-sm"><button onclick="uploadImageToDrive('thumbUpload','prod_thumb')" class="bg-slate-200 px-3 py-1 rounded text-xs">Upload</button></div><label>Images (comma URLs)</label><textarea id="prod_images" class="w-full border p-2 rounded mb-2" rows="2">${escapeHtml(prod.Images)}</textarea><label>Summary</label><textarea id="prod_summary" class="w-full border p-2 rounded mb-2" rows="2">${escapeHtml(prod.Summary)}</textarea><label>Description</label><textarea id="prod_desc" class="w-full border p-2 rounded mb-2" rows="3">${escapeHtml(prod.Description)}</textarea></div><div><label>Technical Info</label><textarea id="prod_tech" class="w-full border p-2 rounded mb-2" rows="3">${escapeHtml(prod.Technical_Info)}</textarea><label>Terms</label><textarea id="prod_terms" class="w-full border p-2 rounded mb-2" rows="2">${escapeHtml(prod.Terms)}</textarea><label>Privacy</label><textarea id="prod_privacy" class="w-full border p-2 rounded mb-2" rows="2">${escapeHtml(prod.Privacy)}</textarea><label>Service Commitment</label><textarea id="prod_service" class="w-full border p-2 rounded mb-2" rows="2">${escapeHtml(prod.ServiceCommitment)}</textarea><hr class="my-2"><label>SEO Title</label><input id="prod_seot" value="${escapeHtml(prod.SEOTitle)}" class="w-full border p-2 rounded mb-2"><label>SEO Description</label><textarea id="prod_seod" class="w-full border p-2 rounded mb-2" rows="2">${escapeHtml(prod.SEODesc)}</textarea><label>SEO Keywords</label><input id="prod_seok" value="${escapeHtml(prod.SEOKeywords)}" class="w-full border p-2 rounded mb-2"><label>OG Title</label><input id="prod_ogtitle" value="${escapeHtml(prod.OGTitle)}" class="w-full border p-2 rounded mb-2"><label>OG Description</label><textarea id="prod_ogdesc" class="w-full border p-2 rounded mb-2" rows="2">${escapeHtml(prod.OGDesc)}</textarea><label>OG Image</label><input id="prod_ogimage" value="${escapeHtml(prod.OGImage)}" class="w-full border p-2 rounded mb-2"><label>Twitter Card</label><input id="prod_twcard" value="${escapeHtml(prod.TwitterCard)}" class="w-full border p-2 rounded mb-2"></div></div><div class="flex gap-3 mt-6"><button onclick="submitProduct()" class="btn-primary px-6 py-2 rounded">Save</button><button onclick="closeModal('productModal')" class="bg-slate-200 px-6 py-2 rounded">Cancel</button></div></div></div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        };
        window.submitProduct = async () => {
            const data = { id: document.getElementById('prod_id').value, catId: document.getElementById('prod_cat').value, title: document.getElementById('prod_title').value, thumb: document.getElementById('prod_thumb').value, imgs: document.getElementById('prod_images').value, summary: document.getElementById('prod_summary').value, desc: document.getElementById('prod_desc').value, tech: document.getElementById('prod_tech').value, terms: document.getElementById('prod_terms').value, privacy: document.getElementById('prod_privacy').value, serviceCommitment: document.getElementById('prod_service').value, seoT: document.getElementById('prod_seot').value, seoD: document.getElementById('prod_seod').value, seoK: document.getElementById('prod_seok').value, ogTitle: document.getElementById('prod_ogtitle').value, ogDesc: document.getElementById('prod_ogdesc').value, ogImage: document.getElementById('prod_ogimage').value, twCard: document.getElementById('prod_twcard').value };
            await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'saveProduct', data }) });
            location.reload();
        };
        window.deleteProductItem = async (id) => { if(confirm('Delete product?')) { await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'deleteProduct', data:{id} }) }); location.reload(); } };
        window.editProduct = (id) => openProductModal(id);

        window.uploadImageToDrive = async (fileInputId, targetInputId) => {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput || !fileInput.files.length) { alert("Select a file first"); return; }
            const formData = new FormData();
            formData.append('action', 'uploadImage');
            formData.append('file', fileInput.files[0]);
            formData.append('filename', fileInput.files[0].name);
            try {
                const res = await fetch(API_URL, { method: 'POST', body: formData });
                const json = await res.json();
                if (json.status === 'success') {
                    document.getElementById(targetInputId).value = json.url;
                    alert("Image uploaded! URL inserted.");
                } else alert("Upload failed: " + json.message);
            } catch(e) { alert("Upload error"); }
        };

        window.closeModal = (id) => { const el = document.getElementById(id); if (el) el.remove(); };
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

        window.addEventListener('hashchange', router);
        window.addEventListener('load', fetchData);
        async function router() {
            const hash = location.hash || '#/';
            const app = document.getElementById('app');
            if (hash === '#/') renderHome(app);
            else if (hash === '#/products') renderProductList(app);
            else if (hash.startsWith('#/product/')) renderProductDetail(app, hash.split('/')[2]);
            else if (hash.startsWith('#/page/')) renderPage(app, hash.split('/')[2]);
            else if (hash === '#/admin-as') renderAdmin(app);
            else renderHome(app);
        }
    </script>
</body>
</html>

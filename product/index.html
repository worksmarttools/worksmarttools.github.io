<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Worksmart Tools</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .product-detail {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .product-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .product-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
        }
        .tech-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .screenshots {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .screenshot {
            width: 100%;
            border-radius: 8px;
        }
        .info-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }
        .back-link {
            display: inline-block;
            margin: 20px 0;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1>Worksmart Tools</h1>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/#products">Products</a>
                <a href="/admin-as/login.html">Admin</a>
            </div>
        </div>
    </nav>

    <div id="productContent" class="product-detail">
        <div class="loading">Loading product details...</div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 Worksmart Tools. All rights reserved.</p>
        </div>
    </footer>

    <script src="/config.js"></script>
    <script>
        // Get product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        async function loadProduct() {
            if (!productId) {
                document.getElementById('productContent').innerHTML = '<div class="loading">Product not found</div>';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}?action=getProduct&id=${productId}`);
                const result = await response.json();
                
                if (result.success && result.product) {
                    const p = result.product;
                    document.title = `${p.title} - Worksmart Tools`;
                    
                    let screenshotsHtml = '';
                    if (p.screenshots && p.screenshots.length > 0) {
                        screenshotsHtml = `
                            <div class="info-section">
                                <h3>Screenshots</h3>
                                <div class="screenshots">
                                    ${p.screenshots.map(img => `<img src="${img}" class="screenshot" alt="Screenshot">`).join('')}
                                </div>
                            </div>
                        `;
                    }
                    
                    document.getElementById('productContent').innerHTML = `
                        <a href="/" class="back-link">← Back to Home</a>
                        <div class="product-header">
                            <h1>${escapeHtml(p.title)}</h1>
                            ${p.category ? `<span class="category-tag">${escapeHtml(p.category)}</span>` : ''}
                        </div>
                        
                        ${p.imageUrl ? `<img src="${p.imageUrl}" class="product-image" alt="${p.title}">` : ''}
                        
                        <div class="tech-section">
                            <h2>Technical Information</h2>
                            <p>${escapeHtml(p.technicalInfo || 'No technical information available')}</p>
                        </div>
                        
                        <div class="tech-section">
                            <h2>Description</h2>
                            <p>${escapeHtml(p.technicalDesc || 'No description available')}</p>
                        </div>
                        
                        ${screenshotsHtml}
                        
                        ${p.termsOfService ? `
                        <div class="info-section">
                            <h3>Terms of Service</h3>
                            <p>${escapeHtml(p.termsOfService)}</p>
                        </div>
                        ` : ''}
                        
                        ${p.privacyPolicy ? `
                        <div class="info-section">
                            <h3>Privacy Policy</h3>
                            <p>${escapeHtml(p.privacyPolicy)}</p>
                        </div>
                        ` : ''}
                        
                        ${p.support ? `
                        <div class="info-section">
                            <h3>Support</h3>
                            <p>${escapeHtml(p.support)}</p>
                        </div>
                        ` : ''}
                    `;
                } else {
                    document.getElementById('productContent').innerHTML = '<div class="loading">Product not found</div>';
                }
            } catch (error) {
                document.getElementById('productContent').innerHTML = '<div class="loading">Error loading product</div>';
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadProduct();
    </script>
</body>
</html>
